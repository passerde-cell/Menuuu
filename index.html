  molluscs:['molluscs','mollusks','mollusc','mollusk','squid','octopus','clam','mussel','oyster','scallop','軟體動物','软体动物','貝類','贝类','軟体動物']
};
const ALG_LOOKUP=new Map();
for(const [k,arr] of Object.entries(ALG_ALIAS)){
  ALG_LOOKUP.set(k.toLowerCase(),k);
  for(const a of arr)ALG_LOOKUP.set(a.toLowerCase(),k);
}
function normAlg(v){
  if(!v)return null;
  const s=String(v).trim();if(!s)return null;
  const low=s.toLowerCase().replace(/[\s_-]+/g,'');
  if(ALG_LOOKUP.has(s.toLowerCase()))return ALG_LOOKUP.get(s.toLowerCase());
  if(ALG_LOOKUP.has(low))return ALG_LOOKUP.get(low);
  for(const [k,arr] of Object.entries(ALG_ALIAS)){
    if(arr.some(a=>s.toLowerCase().includes(a.toLowerCase())))return k;
  }
  return null;
}

function cleanNum(v){
  if(typeof v==='number')return Number.isFinite(v)&&v>=0?v:undefined;
  if(v==null)return undefined;
  let s=String(v).trim();
  if(!s)return undefined;
  // 抓出數字區段（支援歐元/福林/克朗常見空格與千分位）
  const m=s.match(/\d[\d\s.,]*/);
  if(!m)return undefined;
  s=m[0].replace(/\s+/g,'');
  if(s.includes('.')&&s.includes(',')){
    // 誰在後面誰是小數點
    if(s.lastIndexOf(',')>s.lastIndexOf('.'))s=s.replace(/\./g,'').replace(',','.');
    else s=s.replace(/,/g,'');
  }else if(s.includes(',')){
    // 逗號後若剛好 1~2 位數且只有一個逗號，視為歐洲小數點 (如 12,50)；否則視為千分位 (如 1,200)
    const parts=s.split(',');
    if(parts.length===2&&parts[1].length>=1&&parts[1].length<=2)s=parts[0]+'.'+parts[1];
    else s=s.replace(/,/g,'');
  }else if(s.includes('.')){
    const parts=s.split('.');
    if(parts.length>2||(parts.length===2&&parts[1].length===3&&Number(parts[0])>=1))s=s.replace(/\./g,'');
  }
  const n=Number(s);
  return Number.isFinite(n)&&n>=0?n:undefined;
}

const CUR_MAP={'¥':'JPY','￥':'JPY','円':'JPY','€':'EUR','₩':'KRW','원':'KRW','£':'GBP','KČ':'CZK','KC':'CZK','FT':'HUF','ZŁ':'PLN','ZL':'PLN','HK$':'HKD','NT$':'TWD','฿':'THB','₫':'VND','$':'USD','CHF':'CHF'};
function normCur(v){
  if(!v)return '';
  const u=String(v).trim().toUpperCase();
  if(/^[A-Z]{3}$/.test(u))return u;
  for(const [sym,code] of Object.entries(CUR_MAP)){if(u.includes(sym))return code}
  return u.slice(0,3);
}

function extractJsonText(raw){
  let s=String(raw||'').trim();
  if(!s)throw new Error(t('jsonBad'));
  // 若含 markdown code block，優先抓最大的區塊
  const blocks=[...s.matchAll(/```(?:json)?\s*([\s\S]*?)```/gi)].map(m=>m[1].trim()).filter(Boolean);
  if(blocks.length)s=blocks.sort((a,b)=>b.length-a.length)[0];
  const iObj=s.indexOf('{'),iArr=s.indexOf('[');
  let start=-1,openCh='',closeCh='';
  if(iObj!==-1&&(iArr===-1||iObj<iArr)){start=iObj;openCh='{';closeCh='}'}
  else if(iArr!==-1){start=iArr;openCh='[';closeCh=']'}
  if(start===-1)throw new Error(t('jsonBad'));
  const end=s.lastIndexOf(closeCh);
  if(end<=start)throw new Error(t('jsonTrunc'));
  return s.slice(start,end+1);
}

function normalizeMenu(rawObj,customName){
  let m=Array.isArray(rawObj)?{items:rawObj}:(rawObj&&typeof rawObj==='object'?{...rawObj}:null);
  if(!m)throw new Error(t('jsonBad'));
  const rawItems=Array.isArray(m.items)?m.items:(Array.isArray(m.dishes)?m.dishes:(Array.isArray(m.menu)?m.menu:[]));
  const items=rawItems.filter(i=>i&&(i.originalName||i.translatedName)).map(i=>{
    const orig=String(i.originalName||i.translatedName||'').trim();
    const tran=String(i.translatedName||i.originalName||'').trim();
    let ingr=i.mainIngredients;
    if(typeof ingr==='string')ingr=ingr.split(/[,、，;；]/).map(x=>x.trim()).filter(Boolean);
    else if(Array.isArray(ingr))ingr=ingr.map(x=>String(x||'').trim()).filter(Boolean);
    else ingr=[];
    let algs=Array.isArray(i.allergens)?i.allergens:(typeof i.allergens==='string'?i.allergens.split(/[,、，;；]/):[]);
    algs=[...new Set(algs.map(normAlg).filter(Boolean))];
    let nut=undefined;
    if(i.nutrition&&typeof i.nutrition==='object'){
      const kcal=cleanNum(i.nutrition.kcal);
      if(kcal!=null){
        nut={kcal,proteinG:cleanNum(i.nutrition.proteinG)||0,carbsG:cleanNum(i.nutrition.carbsG)||0,fatG:cleanNum(i.nutrition.fatG)||0,fiberG:cleanNum(i.nutrition.fiberG)||0};
      }
    }
    const price=cleanNum(i.priceOriginal??i.price);
    return {
      originalName:orig,
      romanization:i.romanization?String(i.romanization).trim():'',
      translatedName:tran,
      category:String(i.category||'').trim()||t('other'),
      description:String(i.description||'').trim(),
      priceOriginal:price,
      emoji:String(i.emoji||'🍽').trim()||'🍽',
      imageQuery:String(i.imageQuery||'').trim(),
      mainIngredients:ingr,
      allergens:algs,
      nutrition:nut
    };
  });
  if(!items.length)throw new Error('no dishes found');
  const rName=(customName||'').trim()||String(m.restaurantName||'').trim();
  return {
    restaurantName:rName,
    cuisine:String(m.cuisine||'').trim(),
    sourceLanguage:String(m.sourceLanguage||'en').trim().toLowerCase().slice(0,5),
    currency:normCur(m.currency)||S.cur||'USD',
    orderPhrase:String(m.orderPhrase||'').trim(),
    items
  };
}

function parseMenuJson(raw,customName){
  const jsonStr=extractJsonText(raw);
  let parsed;
  try{parsed=JSON.parse(jsonStr)}
  catch{
    // 嘗試修復尾隨逗號 (trailing comma)
    const fixed=jsonStr.replace(/,\s*([}\]])/g,'$1');
    try{parsed=JSON.parse(fixed)}
    catch{
      // 檢查大括號是否不平衡（典型截斷）
      const opens=(jsonStr.match(/\{/g)||[]).length,closes=(jsonStr.match(/\}/g)||[]).length;
      if(opens>closes)throw new Error(t('jsonTrunc'));
      throw new Error(t('jsonBad'));
    }
  }
  return normalizeMenu(parsed,customName);
}

/* ---------- Gemini API (保留原本直連/代理功能) ---------- */
const STR={type:'STRING'},NUM={type:'NUMBER'};
const SCH={type:'OBJECT',properties:{restaurantName:STR,cuisine:STR,sourceLanguage:STR,currency:STR,orderPhrase:STR,items:{type:'ARRAY',items:{type:'OBJECT',properties:{originalName:STR,romanization:STR,translatedName:STR,category:STR,description:STR,priceOriginal:NUM,emoji:STR,imageQuery:STR,mainIngredients:{type:'ARRAY',items:STR},allergens:{type:'ARRAY',items:{type:'STRING',enum:AK}},nutrition:{type:'OBJECT',properties:{kcal:NUM,proteinG:NUM,carbsG:NUM,fatG:NUM,fiberG:NUM}}},required:['originalName','translatedName','category','description','mainIngredients','allergens']}}},required:['sourceLanguage','currency','items']};
const PROMPT=l=>`You are a menu-reading assistant for travelers. The attached image(s) are pages of ONE restaurant menu, in any language or script. Return JSON following the schema.
- originalName: copy the dish name exactly as printed, character by character. Never translate or fix it.
- translatedName, description, category, cuisine, mainIngredients: write in ${l}. description is 1-2 sentences. category = the menu's own section headings translated.
- cuisine: short type of the restaurant/menu, e.g. "Ramen & izakaya".
- romanization: Latin-letter pronunciation of originalName; omit if already Latin script.
- priceOriginal: printed number only; omit if none. currency: ISO 4217 inferred from symbols/country. sourceLanguage: ISO 639-1.
- orderPhrase: the polite phrase "I would like to order:" written in the menu's language and script.
- emoji: one emoji that best represents the dish. imageQuery: generic English dish name for a Wikipedia lookup (e.g. "Shoyu ramen"), no restaurant-specific wording.
- allergens: only allowed values the dish typically contains; if unsure include it (be conservative). nutrition: rough estimate for one serving.
- Skip anything that is not a dish or drink.`;
async function gem(imgs){
  const body=JSON.stringify({contents:[{parts:[...imgs.map(d=>({inline_data:{mime_type:'image/jpeg',data:d}})),{text:PROMPT(S.tgt)}]}],generationConfig:{temperature:.2,responseMimeType:'application/json',responseSchema:SCH}});
  const m=encodeURIComponent(S.model),r=await fetch(S.proxy?S.proxy+(S.proxy.includes('?')?'&':'?')+'model='+m:`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',headers:S.proxy?{'Content-Type':'application/json'}:{'Content-Type':'application/json','x-goog-api-key':S.key},body});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,300));
  const j=await r.json(),x=(j.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('').trim();
  if(!x)throw new Error('empty response');
  return parseMenuJson(x,'');
}
const shr=(c,max)=>{const s=Math.min(1,max/Math.max(c.width,c.height)),o=$d.createElement('canvas');o.width=Math.round(c.width*s);o.height=Math.round(c.height*s);o.getContext('2d').drawImage(c,0,0,o.width,o.height);return o};

const imgCv=f=>new Promise((res,rej)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const s=Math.min(1,2200/Math.max(i.width,i.height)),c=$d.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c)};i.onerror=()=>rej(new Error('bad image'));i.src=u});

async function pasteClipboard(){

  }
  try{
    const txt=(await navigator.clipboard.readText()||'').trim();
    if(!txt){if(errEl){errEl.textContent=t('clipEmpty');show('#imp-err')}return}
    const ta=$('#imp-txt');if(ta)ta.value=txt;

  }
}

  return `<h4>${t('nut')} <small>${t('est')}</small></h4><div class="card"><div class="kc"><b>${Math.round(n.kcal)}</b> kcal</div><div class="sb"><i style="width:${w(p)};background:#3b82f6"></i><i style="width:${w(c)};background:#f59e0b"></i><i style="width:${w(f)};background:#ef4444"></i></div><div class="mc">${m('#3b82f6',t('pro'),p)}${m('#f59e0b',t('carb'),c)}${m('#ef4444',t('fat'),f)}${m('#22c55e',t('fib'),n.fiberG||0)}</div></div>`};
function det(n){const i=M.items[n],m=mine(i);
  $('#det').innerHTML=`<div class="hero"><span class="em">${esc(i.emoji||'🍽')}</span><button class="x" data-a="cd">✕</button><small class="bd hid">${t('sim')}</small></div><div class="pd up"><div class="rw"><h2>${esc(i.translatedName)}</h2><b class="pc">${esc(pt(i))}</b></div><div class="rw"><div><div class="og">${esc(i.originalName)}</div><div class="sub">${esc(i.romanization||'')}</div></div><button class="sp" data-a="say" data-i="${n}">🔊</button></div>${m.length?`<div class="wn">⚠️ <b>${t('warn')}</b> ${esc(m.map(aname).join(', '))}. ${t('warn2')}</div>`:''}<h4>${t('what')}</h4><div>${esc(i.description)}</div><h4>${t('ingr')}</h4><div class="ls">${i.mainIngredients.map(x=>`<div>${esc(x)}</div>`).join('')}</div>${i.allergens.length?`<div class="chs">${i.allergens.map(k=>chip(k,m.includes(k))).join('')}</div>`:''}${i.nutrition&&i.nutrition.kcal!=null?nutv(i.nutrition):''}</div><div class="bb"><button class="btn" data-a="add" data-i="${n}">＋ ${t('add')}</button><button class="btn pri" data-a="ord">${t('show')}</button></div>`;
  show('#det');$('#det').scrollTop=0;const h=$('#det .hero');dishImg(i.imageQuery).then(u=>{if(u){h.style.backgroundImage=`url("${u}")`;h.querySelector('.em').remove();h.querySelector('.bd').classList.remove('hid')}})}
const LC={ja:'ja-JP',ko:'ko-KR',zh:'zh-TW',th:'th-TH',fr:'fr-FR',it:'it-IT',es:'es-ES',de:'de-DE',en:'en-US',vi:'vi-VN',id:'id-ID',pt:'pt-PT',ru:'ru-RU',tr:'tr-TR',ar:'ar-SA',hi:'hi-IN',nl:'nl-NL',pl:'pl-PL',cs:'cs-CZ',hu:'hu-HU'};
function say(x){if(!('speechSynthesis' in window))return toast('No speech');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);const l=(M.sourceLanguage||'en').slice(0,2).toLowerCase();u.lang=LC[l]||l;u.rate=.9;speechSynthesis.speak(u)}

function add(n){
  // 修正：切換不同餐廳 (MID 改變) 時自動重置點餐車，避免同幣別殘留上一家餐廳菜品
  if(C.mid!==MID){C.lines=[];C.mid=MID;C.cur=M.currency;C.phrase=M.orderPhrase||''}
  const k=MID+':'+n,l=C.lines.find(l=>l.k===k);l?l.qty++:C.lines.push({k,i:M.items[n],qty:1});ob();toast('＋1');
}

function wait(){
  const activeLines=C.mid===MID?C.lines:[];
  const tot=activeLines.reduce((s,l)=>s+(l.i.priceOriginal||0)*l.qty,0);
  const homeEst=conv()&&tot>0?`≈ ${mon(tot*rate,S.cur)}`:'';
  $('#wait').innerHTML=`<div class="bar pri"><button data-a="cw">✕</button><div class="tt"><b>${t('turn')}</b></div>${activeLines.length?`<button data-a="clrcart" style="font-size:.85rem;font-weight:600">${t('clear')}</button>`:'<span></span>'}</div>
<div class="pd" style="padding-bottom:150px">
  ${activeLines.length?`<h2 class="big">${esc(C.phrase||'I would like to order:')}</h2>${activeLines.map(l=>`<div class="wl"><div><b>${esc(l.i.originalName)}</b><small>${esc([l.i.romanization,l.i.translatedName].filter(Boolean).join(' · '))}</small></div><div class="qty"><button data-a="qty" data-k="${esc(l.k)}" data-d="-1">−</button>×${l.qty}<button data-a="qty" data-k="${esc(l.k)}" data-d="1">+</button></div></div>`).join('')}`:`<p class="sub" style="text-align:center;margin-top:40px">${t('emptyCart')}</p>`}
</div>
<div class="bb">
  <div class="rw"><span class="sub">${t('total')}</span><div class="totbox"><b>${esc(mon(tot,C.cur||M?.currency||'USD'))}</b>${homeEst?`<small>${esc(homeEst)}</small>`:''}</div></div>
  <button class="btn dk" data-a="cw">${t('done')}</button>
</div>`;
  show('#wait');
}

/* ---------- 主畫面 / 歷史 / 設定 ---------- */
const hrow=h=>`<div class="hr" data-a="hist" data-id="${h.id}"><div class="th"${h.thumb?` style="background-image:url('${h.thumb}')"`:''}>${h.thumb?'':esc(h.menu.items?.[0]?.emoji||'🍽')}</div><div><b>${esc(h.menu.restaurantName||h.menu.cuisine||'—')}</b><div class="sub">${esc((h.menu.sourceLanguage||'').toUpperCase())} · ${h.menu.items.length} ${t('dishes')} · ${new Date(h.id).toLocaleDateString(S.ui==='zh'?'zh-TW':S.ui)}</div></div><small data-a="del" data-id="${h.id}" style="padding:6px">${t('del')}</small></div>`;

function home(){
  const hasApi=Boolean(S.key||S.proxy);
  $('#t-scan').innerHTML=`<b style="font-size:1.2rem;color:var(--pri)">🍽 MenuLens</b>
<button class="scan" data-a="imp"><span class="cam">📋</span><div><b>${t('pasteBtn')}</b><small>${t('pasteSub')} · ${S.cur}</small></div></button>
<details class="sec"${hasApi?' open':''}><summary><span>${t('apiSec')}</span><span>▾</span></summary>
  <div class="three">
    <label class="btn">📷 ${t('scan')}<input id="f1" type="file" accept="image/*" capture="environment" hidden></label>
    <label class="btn">🖼 ${t('photo')}<input id="f2" type="file" accept="image/*" multiple hidden></label>
    <label class="btn">📄 ${t('pdf')}<input id="f3" type="file" accept="application/pdf" hidden></label>
  </div>
</details>
<div id="err" class="err hid"></div>
<h3>${t('recent')}</h3>${H.length?H.slice(0,5).map(hrow).join(''):`<p class="sub">${t('none')}</p>`}`;
}
const histv=()=>{$('#t-hist').innerHTML=`<h2>${t('hist')}</h2>${H.length?H.map(hrow).join(''):`<p class="sub">${t('none')}</p>`}`};
function setv(){let dn;try{dn=new Intl.DisplayNames([S.ui==='zh'?'zh-TW':S.ui],{type:'currency'})}catch{}
  const cs=Intl.supportedValuesOf?Intl.supportedValuesOf('currency'):['USD','EUR','JPY','GBP','TWD','KRW','CNY','HKD','THB','SGD','AUD','CAD','CZK','HUF','PLN'];
  $('#t-set').innerHTML=`<h2>${t('set')}</h2><label class="f">${t('uiL')}</label><select id="sui">${[['en','English'],['zh','繁體中文'],['ja','日本語']].map(([k,n])=>`<option value="${k}" ${k===S.ui?'selected':''}>${n}</option>`).join('')}</select>
<label class="f">${t('cur')}</label><select id="scur">${cs.map(c=>`<option value="${c}" ${c===S.cur?'selected':''}>${c}${dn?' · '+esc(dn.of(c)||''):''}</option>`).join('')}</select>
<label class="f">${t('mine')}</label><div class="card">${AK.map(k=>`<label class="ao">${esc(aname(k))}<input type="checkbox" data-alg="${k}" ${S.alg.includes(k)?'checked':''}></label>`).join('')}</div>
<details class="sec"><summary><span>${t('apiSec')}</span><span>▾</span></summary>
  <label class="f" style="margin-top:0">${t('tgt')}</label><select id="stg">${TG.map(([k,n])=>`<option value="${k}" ${k===S.tgt?'selected':''}>${n}</option>`).join('')}</select>
  <label class="f">${t('key')}</label><input id="skey" type="password" autocomplete="off" placeholder="AIza…" value="${esc(S.key)}"><small>aistudio.google.com/apikey</small>
  <label class="f">${t('model')}</label><input id="smod" type="text" value="${esc(S.model)}">
  <label class="f">${t('proxy')}</label><input id="sprx" type="text" placeholder="https://…workers.dev" value="${esc(S.proxy)}">
</details>`}
const nav=()=>{$('#nav').innerHTML=[['scan','📋',t('home')],['hist','🕘',t('hist')],['set','⚙️',t('set')]].map(([k,e,l])=>`<button data-t="${k}" class="${TAB===k?'on':''}">${e}<small>${l}</small></button>`).join('')};
function tab(k){TAB=k;$d.querySelectorAll('.tab').forEach(s=>s.classList.toggle('on',s.id==='t-'+k));nav();({scan:home,hist:histv,set:setv})[k]();scrollTo(0,0)}
const all=()=>{nav();home();histv();setv();$d.documentElement.lang=S.ui};

$d.addEventListener('click',e=>{const nb=e.target.closest('nav button');if(nb)return tab(nb.dataset.t);
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,n=+b.dataset.i;
  if(a==='del'){e.stopPropagation();H=H.filter(h=>String(h.id)!==b.dataset.id);sv('ml_history',H);home();histv()}
  else if(a==='hist'){const h=H.find(h=>String(h.id)===b.dataset.id);if(h)openMenu(h.menu,h.id)}
  else if(a==='imp')openImp('new');
  else if(a==='app')openImp('append');
  else if(a==='cimp')hide('#imp');
  else if(a==='clip')pasteClipboard();
  else if(a==='impclr'){const ta=$('#imp-txt');if(ta){ta.value='';ta.focus()}hide('#imp-err')}
  else if(a==='impgo')applyImport($('#imp-txt')?.value||'');
  else if(a==='cm')hide('#menu');
  else if(a==='cat'){cat=b.dataset.c;mlist()}
  else if(a==='open')det(n);
  else if(a==='cd')hide('#det');
  else if(a==='say')say(M.items[n].originalName);
  else if(a==='add'){e.stopPropagation();add(n)}
  else if(a==='ord')wait();
  else if(a==='cw')hide('#wait');
  else if(a==='clrcart'){C.lines=[];ob();wait()}
  else if(a==='qty'){const l=C.lines.find(l=>l.k===b.dataset.k);if(l){l.qty+=+b.dataset.d;if(l.qty<=0)C.lines=C.lines.filter(x=>x!==l);ob();wait()}}});

all();warmRates();
if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
