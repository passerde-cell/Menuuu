<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang TC","Noto Sans",sans-serif}
button,input,select{font:inherit;color:inherit}.hid{display:none!important}.sub,small{color:var(--sub);font-size:.8rem}
h2,h3,h4{margin:.5em 0 .25em}
.tab{display:none;padding:calc(14px + env(safe-area-inset-top)) 16px calc(90px + env(safe-area-inset-bottom))}.tab.on{display:block}
nav{position:fixed;inset:auto 0 0;display:flex;background:var(--cd);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:5}
nav button{flex:1;background:0;border:0;padding:8px 0;color:var(--sub);font-size:1.2rem}nav button small{display:block}nav .on{color:var(--pri);font-weight:700}
.scan{display:flex;gap:14px;align-items:center;background:var(--dk);color:#fff;border-radius:18px;padding:20px;margin:14px 0 10px;cursor:pointer}
.scan small{display:block;color:#9fb6c3}.cam{background:#fff;border-radius:50%;width:54px;height:54px;display:grid;place-items:center;font-size:1.5rem}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.btn{display:block;text-align:center;padding:13px;border-radius:12px;border:1px solid var(--ln);background:var(--cd);cursor:pointer;font-weight:600}
.btn.pri{background:var(--pri);color:#fff;border-color:var(--pri)}.btn.dk{background:var(--dk);color:#fff;border:0;width:100%}
.card{background:var(--cd);border:1px solid var(--ln);border-radius:14px;padding:12px 14px;margin:10px 0}

.rw{display:flex;justify-content:space-between;align-items:center;gap:10px}.pc{font-size:1.4rem;color:var(--pri)}.og{font-size:1.3rem;font-weight:700}
.sp{width:44px;height:44px;border-radius:50%;border:0;background:var(--pri);color:#fff;font-size:1.1rem}

.bb{position:fixed;left:0;right:0;bottom:0;display:flex;gap:10px;flex-wrap:wrap;background:var(--cd);border-top:1px solid var(--ln);padding:12px 16px calc(12px + env(safe-area-inset-bottom))}.bb .btn{flex:1}.bb .rw{width:100%}
.big{font-size:1.7rem}.wl{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:14px 0;border-bottom:1px solid var(--ln)}.wl b{font-size:1.7rem;display:block;line-height:1.2}
.qty{display:flex;align-items:center;gap:10px;font-size:1.5rem;font-weight:800}.qty button{width:34px;height:34px;border-radius:50%;border:1px solid var(--ln);background:var(--cd);font-size:1.1rem}
label.f{display:block;margin:12px 0 4px;font-weight:600}.ao{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--ln)}

#busy i{width:36px;height:36px;border:4px solid #fff5;border-top-color:#fff;border-radius:50%;animation:s 1s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
#toast{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111d;color:#fff;padding:8px 14px;border-radius:99px;z-index:60;font-size:.85rem;max-width:90%}

<script>
'use strict';
const $=s=>$d.querySelector(s),$d=document,esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const show=s=>$(s).classList.remove('hid'),hide=s=>$(s).classList.add('hid');
let tt;function toast(m){const e=$('#toast');e.textContent=m;show('#toast');clearTimeout(tt);tt=setTimeout(()=>hide('#toast'),2200)}

/* i18n:UI 內建 en / 繁中 / 日本語;菜單翻譯語言不限(由 Gemini 負責) */

zh:{home:'掃描',hist:'歷史',set:'設定',scan:'掃描菜單',photo:'從照片',pdf:'從 PDF',recent:'最近的菜單',dishes:'道菜',search:'搜尋菜品',all:'全部',add:'加入點餐',show:'展示給服務員',what:'這是什麼',ingr:'主要食材',nut:'營養',est:'AI 估算',warn:'偵測到可能的過敏原:',warn2:'點餐前請向店員確認。',sim:'相似菜色 · 僅供參考',total:'預估總價',done:'完成',turn:'請把手機轉向服務生',need:'請先到「設定」填入 API Key 或伺服器位址。',busy:'正在讀取菜單…',fail:'辨識失敗:',none:'還沒有紀錄',del:'刪除',cart:'點餐',pro:'蛋白質',carb:'碳水',fat:'脂肪',fib:'纖維',uiL:'介面語言',tgt:'翻譯成',cur:'價格換算成',mine:'我的過敏原',key:'Gemini API Key',model:'模型',proxy:'伺服器位址(選填)',disc:'過敏原與營養資訊由 AI 推測,可能有誤。若有嚴重過敏,請務必向店員確認。'},
ja:{home:'スキャン',hist:'履歴',set:'設定',scan:'メニューをスキャン',photo:'写真から',pdf:'PDFから',recent:'最近のメニュー',dishes:'品',search:'料理を検索',all:'すべて',add:'注文に追加',show:'店員に見せる',what:'どんな料理?',ingr:'主な食材',nut:'栄養',est:'AI推定',warn:'アレルゲンの可能性:',warn2:'注文前に店員にご確認ください。',sim:'参考イメージ',total:'合計(目安)',done:'完了',turn:'スマホを店員さんに向けてください',need:'設定でAPIキーまたはサーバーURLを入力してください。',busy:'メニューを読み取り中…',fail:'読み取り失敗:',none:'履歴はありません',del:'削除',cart:'注文',pro:'たんぱく質',carb:'炭水化物',fat:'脂質',fib:'食物繊維',uiL:'表示言語',tgt:'翻訳先',cur:'換算通貨',mine:'自分のアレルゲン',key:'Gemini APIキー',model:'モデル',proxy:'サーバーURL(任意)',disc:'アレルゲン・栄養情報はAIの推定で誤りがある場合があります。重いアレルギーがある方は必ず店員にご確認ください。'}};
const AK='gluten,crustaceans,eggs,fish,peanuts,soy,milk,treeNuts,celery,mustard,sesame,sulphites,lupin,molluscs'.split(',');
const AL={en:'Gluten,Crustaceans,Eggs,Fish,Peanuts,Soy,Milk,Tree nuts,Celery,Mustard,Sesame,Sulphites,Lupin,Molluscs',zh:'麩質,甲殼類,蛋,魚,花生,大豆,乳製品,堅果,芹菜,芥末,芝麻,亞硫酸鹽,羽扇豆,軟體動物',ja:'グルテン,甲殻類,卵,魚,ピーナッツ,大豆,乳,木の実,セロリ,マスタード,ごま,亜硫酸塩,ルピナス,軟体動物'};
const TG=[['English','English'],['Traditional Chinese','繁體中文'],['Simplified Chinese','简体中文'],['Japanese','日本語'],['Korean','한국어'],['Spanish','Español'],['French','Français'],['German','Deutsch'],['Italian','Italiano'],['Portuguese','Português'],['Russian','Русский'],['Thai','ไทย'],['Vietnamese','Tiếng Việt'],['Indonesian','Bahasa Indonesia'],['Arabic','العربية'],['Hindi','हिन्दी'],['Turkish','Türkçe'],['Dutch','Nederlands'],['Polish','Polski']];
const L=(navigator.language||'en').toLowerCase(),o=ld('ml_settings',{}),RC={TW:'TWD',US:'USD',JP:'JPY',GB:'GBP',KR:'KRW',CN:'CNY',HK:'HKD',SG:'SGD',AU:'AUD',CA:'CAD',TH:'THB',VN:'VND',IN:'INR',MX:'MXN',BR:'BRL',CH:'CHF',DE:'EUR',FR:'EUR',ES:'EUR',IT:'EUR'};
let S=Object.assign({ui:L.startsWith('zh')?'zh':L.startsWith('ja')?'ja':'en',tgt:L.startsWith('zh')?'Traditional Chinese':L.startsWith('ja')?'Japanese':'English',cur:o.currency||RC[(L.split('-')[1]||'').toUpperCase()]||'USD',alg:o.allergens||[],key:o.apiKey||'',model:'gemini-3.8-flash',proxy:''},ld('ml_s',{}));
const t=k=>(T[S.ui]||T.en)[k]??T.en[k]??k,aname=k=>(AL[S.ui]||AL.en).split(',')[AK.indexOf(k)],tl=()=>(TG.find(x=>x[0]===S.tgt)||[0,S.tgt])[1];
let H=ld('ml_history',[]),M=null,MID=0,rate=null,cat='',q='',TAB='scan';const C={cur:'',phrase:'',lines:[]};

/* ---------- Gemini ---------- */
const STR={type:'STRING'},NUM={type:'NUMBER'};
const SCH={type:'OBJECT',properties:{restaurantName:STR,cuisine:STR,sourceLanguage:STR,currency:STR,orderPhrase:STR,items:{type:'ARRAY',items:{type:'OBJECT',properties:{originalName:STR,romanization:STR,translatedName:STR,category:STR,description:STR,priceOriginal:NUM,emoji:STR,imageQuery:STR,mainIngredients:{type:'ARRAY',items:STR},allergens:{type:'ARRAY',items:{type:'STRING',enum:AK}},nutrition:{type:'OBJECT',properties:{kcal:NUM,proteinG:NUM,carbsG:NUM,fatG:NUM,fiberG:NUM}}},required:['originalName','translatedName','category','description','mainIngredients','allergens']}}},required:['sourceLanguage','currency','items']};
const PROMPT=l=>`You are a menu-reading assistant for travelers. The attached image(s) are pages of ONE restaurant menu, in any language or script. Return JSON following the schema.
- originalName: copy the dish name exactly as printed, character by character. Never translate or fix it.
- translatedName, description, category, cuisine, mainIngredients: write in ${l}. description is 1-2 sentences. category = the menu's own section headings translated.
- cuisine: short type of the restaurant/menu, e.g. "Ramen & izakaya".
- romanization: Latin-letter pronunciation of originalName; omit if already Latin script.
- priceOriginal: printed number only; omit if none. currency: ISO 4217 inferred from symbols/country. sourceLanguage: ISO 639-1.
- orderPhrase: the polite phrase "I would like to order:" written in the menu's language and script.
- emoji: one emoji that best represents the dish. imageQuery: generic English dish name for a Wikipedia lookup (e.g. "Shoyu ramen"), no restaurant-specific wording.
- allergens: only allowed values the dish typically contains; if unsure include it (be conservative). nutrition: rough estimate for one serving.
- Skip anything that is not a dish or drink.`;
async function gem(imgs){
  const body=JSON.stringify({contents:[{parts:[...imgs.map(d=>({inline_data:{mime_type:'image/jpeg',data:d}})),{text:PROMPT(S.tgt)}]}],generationConfig:{temperature:.2,responseMimeType:'application/json',responseSchema:SCH}});
  const m=encodeURIComponent(S.model),r=await fetch(S.proxy?S.proxy+(S.proxy.includes('?')?'&':'?')+'model='+m:`https://generativelanguage.googleapis.com/v1beta/models/${m}:generateContent`,{method:'POST',headers:S.proxy?{'Content-Type':'application/json'}:{'Content-Type':'application/json','x-goog-api-key':S.key},body});
  if(!r.ok)throw new Error(r.status+' '+(await r.text()).slice(0,300));
  const j=await r.json(),x=(j.candidates?.[0]?.content?.parts||[]).filter(p=>!p.thought).map(p=>p.text||'').join('').replace(/^```json\s*|```\s*$/g,'').trim();
  if(!x)throw new Error('empty response');
  const m2=JSON.parse(x);m2.items=(m2.items||[]).filter(i=>i&&i.originalName).map(i=>({...i,mainIngredients:i.mainIngredients||[],allergens:(i.allergens||[]).filter(a=>AK.includes(a))}));
  if(!m2.items.length)throw new Error('no dishes found');return m2}
const shr=(c,max)=>{const s=Math.min(1,max/Math.max(c.width,c.height)),o=$d.createElement('canvas');o.width=Math.round(c.width*s);o.height=Math.round(c.height*s);o.getContext('2d').drawImage(c,0,0,o.width,o.height);return o};
const b64=c=>shr(c,1800).toDataURL('image/jpeg',.85).split(',')[1];
const imgCv=f=>new Promise((res,rej)=>{const u=URL.createObjectURL(f),i=new Image();i.onload=()=>{const s=Math.min(1,2200/Math.max(i.width,i.height)),c=$d.createElement('canvas');c.width=Math.round(i.width*s);c.height=Math.round(i.height*s);c.getContext('2d').drawImage(i,0,0,c.width,c.height);URL.revokeObjectURL(u);res(c)};i.onerror=()=>rej(new Error('bad image'));i.src=u});
async function pdfCv(f){const V='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
  if(!window.pdfjsLib){await new Promise((r,j)=>{const s=$d.createElement('script');s.src=V+'pdf.min.js';s.onload=r;s.onerror=()=>j(new Error('PDF library failed to load'));$d.head.append(s)});pdfjsLib.GlobalWorkerOptions.workerSrc=V+'pdf.worker.min.js'}
  const d=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,out=[];
  for(let n=1;n<=Math.min(d.numPages,4);n++){const p=await d.getPage(n),v0=p.getViewport({scale:1}),v=p.getViewport({scale:2000/Math.max(v0.width,v0.height)}),c=$d.createElement('canvas');c.width=v.width;c.height=v.height;await p.render({canvasContext:c.getContext('2d'),viewport:v}).promise;out.push(c)}return out}
async function run(files,isPdf){
  hide('#err');if(!S.key&&!S.proxy){tab('set');return toast(t('need'))}
  $('#bt').textContent=t('busy');show('#busy');
  try{const cv=isPdf?await pdfCv(files[0]):await Promise.all([...files].slice(0,6).map(imgCv));
    const m=await gem(cv.map(b64)),id=Date.now();let th='';try{th=shr(cv[0],110).toDataURL('image/jpeg',.6)}catch{}
    H.unshift({id,thumb:th,menu:m});H=H.slice(0,30);sv('ml_history',H);openMenu(m,id);home()}
  catch(e){const el=$('#err');if(el){el.textContent=t('fail')+e.message;show('#err')}else toast(t('fail')+e.message)}
  finally{hide('#busy')}}
$d.addEventListener('change',e=>{const i=e.target,id=i.id;
  if(id==='f1'||id==='f2'||id==='f3'){const f=[...i.files];i.value='';if(f.length)run(f,id==='f3')}
  else if(id==='sui'){S.ui=i.value;sv('ml_s',S);all()}else if(id==='stg')S.tgt=i.value;else if(id==='scur'){S.cur=i.value}
  else if(i.dataset.alg)S.alg=i.checked?[...new Set([...S.alg,i.dataset.alg])]:S.alg.filter(a=>a!==i.dataset.alg);else return;sv('ml_s',S)});
$d.addEventListener('input',e=>{const i=e.target;if(i.id==='skey')S.key=i.value.trim();else if(i.id==='smod')S.model=i.value.trim()||'gemini-3.8-flash';else if(i.id==='sprx')S.proxy=i.value.trim();else if(i.id==='q'){q=i.value;return mlist()}else return;sv('ml_s',S)});

/* ---------- 匯率 / 圖片 ---------- */
async function getRate(a,b){if(!a||!b)return null;if(a===b)return 1;let c=ld('ml_rates',null);
  if(!c||Date.now()-c.t>864e5){try{const j=await(await fetch('https://open.er-api.com/v6/latest/USD')).json();if(j.rates){c={t:Date.now(),rates:j.rates};sv('ml_rates',c)}}catch{}}
  const f=c?.rates?.[a],g=c?.rates?.[b];return f&&g?g/f:null}
const IMG=ld('ml_img',{});
async function dishImg(k){if(!k)return null;if(k in IMG)return IMG[k]||null;
  try{const j=await(await fetch('https://en.wikipedia.org/w/api.php?action=query&generator=search&gsrsearch='+encodeURIComponent(k)+'&gsrlimit=1&prop=pageimages&piprop=thumbnail&pithumbsize=500&format=json&origin=*')).json();IMG[k]=Object.values(j.query?.pages||{})[0]?.thumbnail?.source||''}catch{return null}
  sv('ml_img',IMG);return IMG[k]||null}
const hyd=sel=>$d.querySelectorAll(sel+' .ph[data-q]').forEach(el=>dishImg(el.dataset.q).then(u=>{if(u){el.style.backgroundImage=`url("${u}")`;el.firstChild.nodeValue=''}}));

/* ---------- 菜單 ---------- */
const mon=(v,c)=>{try{return new Intl.NumberFormat(S.ui==='zh'?'zh-TW':S.ui,{style:'currency',currency:c}).format(v)}catch{return v+' '+c}};
const conv=()=>rate&&M.currency!==S.cur;
const pt=i=>i.priceOriginal==null?'':conv()?mon(i.priceOriginal*rate,S.cur):mon(i.priceOriginal,M.currency),po=i=>i.priceOriginal!=null&&conv()?mon(i.priceOriginal,M.currency):'';
const mine=i=>i.allergens.filter(a=>S.alg.includes(a));
const chip=(k,r)=>`<span class="ch ${r?'r':''}"><i style="background:${r?'#dc2626':`hsl(${AK.indexOf(k)*27} 75% 50%)`}"></i>${esc(aname(k))}</span>`;
const chips=i=>{const m=mine(i),a=[...m,...i.allergens.filter(x=>!m.includes(x))];return a.slice(0,3).map(k=>chip(k,m.includes(k))).join('')+(a.length>3?`<small>+${a.length-3}</small>`:'')};
const card=(i,n)=>`<div class="it" data-a="open" data-i="${n}"><div class="tx"><b>${esc(i.translatedName)}</b><div class="sub">${esc([i.originalName,i.romanization].filter(Boolean).join(' · '))}</div><p>${esc(i.description)}</p><div class="pr"><b>${esc(pt(i))}</b><small>${esc(po(i))}</small>${chips(i)}</div></div><div class="ph" data-q="${esc(i.imageQuery||'')}">${esc(i.emoji||'🍽')}<button class="pl" data-a="add" data-i="${n}">+</button></div></div>`;
const cnt=()=>C.lines.reduce((s,l)=>s+l.qty,0);
function openMenu(m,id){M=m;MID=id;cat='';q='';rate=null;
  $('#menu').innerHTML=`<div class="bar"><button data-a="cm">‹</button><div class="tt"><b>${esc(m.restaurantName||m.cuisine||'')}</b><small>${esc(m.restaurantName?m.cuisine||'':'')}</small></div><button data-a="ord" id="ob"></button></div><div class="pd"><input id="q" type="search" placeholder="${esc(t('search'))}"><div id="tabs" class="tabs"></div><div id="ml"></div><p class="sub">${t('disc')}</p></div>`;
  ob();show('#menu');mlist();getRate(m.currency,S.cur).then(r=>{rate=r;if(M===m)mlist()})}
const ob=()=>{const b=$('#ob');if(b)b.innerHTML=`<small style="color:var(--pri)">${t('cart')}</small> ${cnt()}`};
function mlist(){const cs=[...new Set(M.items.map(i=>i.category))];
  $('#tabs').innerHTML=[['',t('all'),M.items.length],...cs.map(c=>[c,c,M.items.filter(i=>i.category===c).length])].map(([c,n,k])=>`<span class="tb ${cat===c?'on':''}" data-a="cat" data-c="${esc(c)}">${esc(n)} <small>${k}</small></span>`).join('');
  const ql=q.trim().toLowerCase();
  $('#ml').innerHTML=M.items.map((i,n)=>[i,n]).filter(([i])=>(!cat||i.category===cat)&&(!ql||(i.translatedName+i.originalName+(i.romanization||'')).toLowerCase().includes(ql))).map(([i,n])=>card(i,n)).join('');hyd('#ml')}
const nutv=n=>{const p=n.proteinG||0,c=n.carbsG||0,f=n.fatG||0,s=p+c+f||1,w=x=>(x/s*100).toFixed(1)+'%',m=(col,l,v)=>`<span><i style="background:${col}"></i> ${l}<b>${Math.round(v)} g</b></span>`;
  return `<h4>${t('nut')} <small>${t('est')}</small></h4><div class="card"><div class="kc"><b>${Math.round(n.kcal)}</b> kcal</div><div class="sb"><i style="width:${w(p)};background:#3b82f6"></i><i style="width:${w(c)};background:#f59e0b"></i><i style="width:${w(f)};background:#ef4444"></i></div><div class="mc">${m('#3b82f6',t('pro'),p)}${m('#f59e0b',t('carb'),c)}${m('#ef4444',t('fat'),f)}${m('#22c55e',t('fib'),n.fiberG||0)}</div></div>`};
function det(n){const i=M.items[n],m=mine(i);
  $('#det').innerHTML=`<div class="hero"><span class="em">${esc(i.emoji||'🍽')}</span><button class="x" data-a="cd">✕</button><small class="bd hid">${t('sim')}</small></div><div class="pd up"><div class="rw"><h2>${esc(i.translatedName)}</h2><b class="pc">${esc(pt(i))}</b></div><div class="rw"><div><div class="og">${esc(i.originalName)}</div><div class="sub">${esc(i.romanization||'')}</div></div><button class="sp" data-a="say" data-i="${n}">🔊</button></div>${m.length?`<div class="wn">⚠️ <b>${t('warn')}</b> ${esc(m.map(aname).join(', '))}. ${t('warn2')}</div>`:''}<h4>${t('what')}</h4><div>${esc(i.description)}</div><h4>${t('ingr')}</h4><div class="ls">${i.mainIngredients.map(x=>`<div>${esc(x)}</div>`).join('')}</div>${i.allergens.length?`<div class="chs">${i.allergens.map(k=>chip(k,m.includes(k))).join('')}</div>`:''}${i.nutrition&&i.nutrition.kcal!=null?nutv(i.nutrition):''}</div><div class="bb"><button class="btn" data-a="add" data-i="${n}">＋ ${t('add')}</button><button class="btn pri" data-a="ord">${t('show')}</button></div>`;
  show('#det');$('#det').scrollTop=0;const h=$('#det .hero');dishImg(i.imageQuery).then(u=>{if(u){h.style.backgroundImage=`url("${u}")`;h.querySelector('.em').remove();h.querySelector('.bd').classList.remove('hid')}})}
const LC={ja:'ja-JP',ko:'ko-KR',zh:'zh-TW',th:'th-TH',fr:'fr-FR',it:'it-IT',es:'es-ES',de:'de-DE',en:'en-US',vi:'vi-VN',id:'id-ID',pt:'pt-PT',ru:'ru-RU',tr:'tr-TR',ar:'ar-SA',hi:'hi-IN',nl:'nl-NL',pl:'pl-PL'};
function say(x){if(!('speechSynthesis' in window))return toast('No speech');speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(x);const l=(M.sourceLanguage||'en').slice(0,2).toLowerCase();u.lang=LC[l]||l;u.rate=.9;speechSynthesis.speak(u)}
function add(n){if(C.cur!==M.currency){C.lines=[];C.cur=M.currency}C.phrase=M.orderPhrase||'';const k=MID+':'+n,l=C.lines.find(l=>l.k===k);l?l.qty++:C.lines.push({k,i:M.items[n],qty:1});ob();toast('＋1')}
function wait(){const tot=C.lines.reduce((s,l)=>s+(l.i.priceOriginal||0)*l.qty,0);
  $('#wait').innerHTML=`<div class="bar pri"><button data-a="cw">✕</button><div class="tt"><b>${t('turn')}</b></div><span></span></div><div class="pd" style="padding-bottom:150px"><h2 class="big">${esc(C.phrase||'I would like to order:')}</h2>${C.lines.map(l=>`<div class="wl"><div><b>${esc(l.i.originalName)}</b><small>${esc([l.i.romanization,l.i.translatedName].filter(Boolean).join(' · '))}</small></div><div class="qty"><button data-a="qty" data-k="${esc(l.k)}" data-d="-1">−</button>×${l.qty}<button data-a="qty" data-k="${esc(l.k)}" data-d="1">+</button></div></div>`).join('')}</div><div class="bb"><div class="rw"><span class="sub">${t('total')}</span><b>${esc(mon(tot,C.cur||'USD'))}</b></div><button class="btn dk" data-a="cw">${t('done')}</button></div>`;show('#wait')}

/* ---------- 主畫面 / 歷史 / 設定 ---------- */
const hrow=h=>`<div class="hr" data-a="hist" data-id="${h.id}"><div class="th" style="background-image:url('${h.thumb||''}')">${h.thumb?'':'🍽'}</div><div><b>${esc(h.menu.restaurantName||h.menu.cuisine||'—')}</b><div class="sub">${esc((h.menu.sourceLanguage||'').toUpperCase())} · ${h.menu.items.length} ${t('dishes')} · ${new Date(h.id).toLocaleDateString(S.ui==='zh'?'zh-TW':S.ui)}</div></div><small data-a="del" data-id="${h.id}">${t('del')}</small></div>`;
function home(){$('#t-scan').innerHTML=`<b style="font-size:1.2rem;color:var(--pri)">🍽 MenuLens</b>${S.key||S.proxy?'':`<div class="card">${t('need')}</div>`}<label class="scan"><span class="cam">📷</span><div><b>${t('scan')}</b><small>${esc(tl())} · ${S.cur}</small></div><input id="f1" type="file" accept="image/*" capture="environment" hidden></label><div class="two"><label class="btn">🖼 ${t('photo')}<input id="f2" type="file" accept="image/*" multiple hidden></label><label class="btn">📄 ${t('pdf')}<input id="f3" type="file" accept="application/pdf" hidden></label></div><div id="err" class="err hid"></div><h3>${t('recent')}</h3>${H.length?H.slice(0,4).map(hrow).join(''):`<p class="sub">${t('none')}</p>`}`}
const histv=()=>{$('#t-hist').innerHTML=`<h2>${t('hist')}</h2>${H.length?H.map(hrow).join(''):`<p class="sub">${t('none')}</p>`}`};
function setv(){let dn;try{dn=new Intl.DisplayNames([S.ui==='zh'?'zh-TW':S.ui],{type:'currency'})}catch{}
  const cs=Intl.supportedValuesOf?Intl.supportedValuesOf('currency'):['USD','EUR','JPY','GBP','TWD','KRW','CNY','HKD','THB','SGD','AUD','CAD'];
  $('#t-set').innerHTML=`<h2>${t('set')}</h2><label class="f">${t('uiL')}</label><select id="sui">${[['en','English'],['zh','繁體中文'],['ja','日本語']].map(([k,n])=>`<option value="${k}" ${k===S.ui?'selected':''}>${n}</option>`).join('')}</select>
<label class="f">${t('tgt')}</label><select id="stg">${TG.map(([k,n])=>`<option value="${k}" ${k===S.tgt?'selected':''}>${n}</option>`).join('')}</select>
<label class="f">${t('cur')}</label><select id="scur">${cs.map(c=>`<option value="${c}" ${c===S.cur?'selected':''}>${c}${dn?' · '+esc(dn.of(c)||''):''}</option>`).join('')}</select>
<label class="f">${t('mine')}</label><div class="card">${AK.map(k=>`<label class="ao">${esc(aname(k))}<input type="checkbox" data-alg="${k}" ${S.alg.includes(k)?'checked':''}></label>`).join('')}</div>
<label class="f">${t('key')}</label><input id="skey" type="password" autocomplete="off" placeholder="AIza…" value="${esc(S.key)}"><small>aistudio.google.com/apikey</small>
<label class="f">${t('model')}</label><input id="smod" type="text" value="${esc(S.model)}"><label class="f">${t('proxy')}</label><input id="sprx" type="text" placeholder="https://…workers.dev" value="${esc(S.proxy)}">`}
const nav=()=>{$('#nav').innerHTML=[['scan','📷',t('home')],['hist','🕘',t('hist')],['set','⚙️',t('set')]].map(([k,e,l])=>`<button data-t="${k}" class="${TAB===k?'on':''}">${e}<small>${l}</small></button>`).join('')};
function tab(k){TAB=k;$d.querySelectorAll('.tab').forEach(s=>s.classList.toggle('on',s.id==='t-'+k));nav();({scan:home,hist:histv,set:setv})[k]();scrollTo(0,0)}
const all=()=>{nav();home();histv();setv();$d.documentElement.lang=S.ui};
$d.addEventListener('click',e=>{const nb=e.target.closest('nav button');if(nb)return tab(nb.dataset.t);
  const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,n=+b.dataset.i;
  if(a==='del'){e.stopPropagation();H=H.filter(h=>String(h.id)!==b.dataset.id);sv('ml_history',H);home();histv()}
  else if(a==='hist'){const h=H.find(h=>String(h.id)===b.dataset.id);if(h)openMenu(h.menu,h.id)}
  else if(a==='cm')hide('#menu');else if(a==='cat'){cat=b.dataset.c;mlist()}else if(a==='open')det(n);else if(a==='cd')hide('#det');
  else if(a==='say')say(M.items[n].originalName);else if(a==='add')add(n);else if(a==='ord')wait();else if(a==='cw')hide('#wait');
  else if(a==='qty'){const l=C.lines.find(l=>l.k===b.dataset.k);if(l){l.qty+=+b.dataset.d;if(l.qty<=0)C.lines=C.lines.filter(x=>x!==l);ob();wait()}}});
all();if('serviceWorker' in navigator&&(location.protocol==='https:'||location.hostname==='localhost'))navigator.serviceWorker.register('sw.js').catch(()=>{});
</script></body></html>
